<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="2">
<title>Context Brainstorm</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    padding: 2rem; line-height: 1.6;
    max-width: 1200px; margin: 0 auto;
  }

  h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
  h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem; }
  .subtitle { color: #888; margin-bottom: 1.5rem; }

  /* Options — A/B/C clickable cards */
  .options { display: flex; flex-direction: column; gap: 1rem; margin: 1.5rem 0; }
  .option {
    display: flex; align-items: flex-start; gap: 1rem;
    background: #161616; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 1.25rem; cursor: default; transition: border-color 0.2s;
  }
  .option:hover { border-color: #444; }
  .letter {
    flex-shrink: 0; width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
    font-weight: 600; font-size: 0.85rem; color: #aaa;
  }
  .content { flex: 1; }
  .content p { color: #999; font-size: 0.9rem; margin-top: 0.25rem; }

  /* Cards — visual designs side by side */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin: 1.5rem 0; }
  .card {
    background: #161616; border: 1px solid #2a2a2a; border-radius: 12px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .card:hover { border-color: #444; }
  .card-image { background: #1a1a1a; min-height: 180px; display: flex; align-items: center; justify-content: center; }
  .card-body { padding: 1rem; }

  /* Mockup container */
  .mockup { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
  .mockup-header { padding: 0.5rem 1rem; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; font-size: 0.8rem; color: #666; }
  .mockup-body { padding: 1rem; }

  /* Split view */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin: 1.5rem 0; }

  /* Pros/Cons */
  .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
  .pros, .cons { padding: 1rem; border-radius: 8px; }
  .pros { background: rgba(74, 222, 128, 0.05); border: 1px solid rgba(74, 222, 128, 0.15); }
  .cons { background: rgba(248, 113, 113, 0.05); border: 1px solid rgba(248, 113, 113, 0.15); }
  .pros h4 { color: #4ade80; } .cons h4 { color: #f87171; }
  ul { padding-left: 1.25rem; margin-top: 0.5rem; }
  li { margin-bottom: 0.25rem; color: #bbb; font-size: 0.9rem; }

  /* Mock wireframe elements */
  .mock-nav { background: #1a1a1a; padding: 0.75rem 1rem; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; color: #888; }
  .mock-sidebar { background: #141414; padding: 1rem; min-width: 180px; border-right: 1px solid #2a2a2a; color: #666; font-size: 0.85rem; }
  .mock-content { padding: 1rem; flex: 1; color: #888; }
  .mock-button { background: #6366f1; color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 8px; font-size: 0.9rem; cursor: default; }
  .mock-input { background: #1a1a1a; border: 1px solid #333; padding: 0.5rem; border-radius: 6px; color: #ccc; font-size: 0.9rem; }
  .placeholder { background: #1a1a1a; border: 1px dashed #333; border-radius: 8px; padding: 2rem; text-align: center; color: #555; }

  /* Section and label */
  .section { margin-bottom: 2rem; }
  .label { text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.08em; color: #666; margin-bottom: 0.5rem; }

  /* Waiting state */
  .waiting { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: #555; font-size: 1.1rem; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
