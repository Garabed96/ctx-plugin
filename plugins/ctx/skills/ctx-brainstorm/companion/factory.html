<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinker Factory</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0e17;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .top-bar-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #e2e8f0;
  }
  .proto-select {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    min-width: 180px;
  }
  .proto-select:focus { outline: none; border-color: #818cf8; }
  .presets {
    display: flex;
    gap: 0.35rem;
  }
  .preset-btn {
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover { border-color: #818cf8; color: #c7d2fe; }
  .preset-btn.active { background: #312e81; border-color: #818cf8; color: #c7d2fe; }
  .status-dot {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    color: #64748b;
  }
  .status-dot-circle {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64748b;
    transition: background 0.2s;
  }
  .status-dot.connected .status-dot-circle { background: #22c55e; }
  .status-dot.connected .status-dot-label { color: #86efac; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Controls panel */
  .controls {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid #1e293b;
    padding: 1rem;
    overflow-y: auto;
    background: #0f172a;
  }
  .controls-section {
    margin-bottom: 1rem;
  }
  .controls-section-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #64748b;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #1e293b;
  }
  .control-group {
    margin-bottom: 0.75rem;
  }
  .control-label {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 0.3rem;
    display: block;
  }
  .control-select {
    width: 100%;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 0.35rem 0.5rem;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
  }
  .control-select:focus { outline: none; border-color: #818cf8; }
  .control-range {
    width: 100%;
    accent-color: #818cf8;
    cursor: pointer;
  }
  .control-range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.6rem;
    color: #475569;
    margin-top: 0.15rem;
  }
  .control-value {
    font-size: 0.7rem;
    color: #818cf8;
    float: right;
  }

  /* Slots section in sidebar */
  .slot-sidebar-group {
    margin-bottom: 0.5rem;
  }
  .slot-sidebar-name {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #475569;
    margin-bottom: 0.3rem;
  }
  .slot-sidebar-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }
  .slot-sidebar-pill {
    font-size: 0.65rem;
    padding: 0.2rem 0.45rem;
    border-radius: 3px;
    border: 1px solid #334155;
    background: #0a0e17;
    color: #64748b;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .slot-sidebar-pill:hover { border-color: #6366f1; color: #a5b4fc; }
  .slot-sidebar-pill.active {
    border-color: #818cf8;
    background: #1e1b4b;
    color: #c7d2fe;
    box-shadow: 0 0 0 1px #818cf8;
  }

  /* Preview area */
  .preview-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .preview-iframe {
    flex: 1;
    border: none;
    background: #fff;
    margin: 0.75rem 0.75rem 0 0.75rem;
    border-radius: 8px;
  }
  .preview-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0.75rem 0.75rem 0 0.75rem;
    border-radius: 8px;
    border: 1px dashed #334155;
    background: #0f172a;
  }
  .preview-placeholder p {
    color: #475569;
    font-size: 0.85rem;
    text-align: center;
    line-height: 1.6;
  }

  /* Slots bar (below iframe) */
  .slots-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1rem;
    padding: 0.5rem 0.75rem;
    background: #0a0e17;
    border-top: 1px solid #1e293b;
    margin: 0 0.75rem;
    flex-shrink: 0;
    min-height: 38px;
  }
  .slot-group {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .slot-name {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #475569;
    margin-right: 0.1rem;
    white-space: nowrap;
  }
  .slot-pills {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
  }
  .slot-pill {
    font-size: 0.65rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #64748b;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .slot-pill:hover { border-color: #6366f1; color: #a5b4fc; }
  .slot-pill.active {
    border-color: #818cf8;
    background: #1e1b4b;
    color: #c7d2fe;
    box-shadow: 0 0 0 1px #818cf8;
  }

  /* Prompt bar */
  .prompt-bar {
    border-top: 1px solid #1e293b;
    padding: 0.65rem 1rem;
    background: #0f172a;
    display: flex;
    gap: 0.5rem;
    align-items: start;
    flex-shrink: 0;
  }
  .prompt-text {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
    color: #94a3b8;
    min-height: 42px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    overflow-y: auto;
    max-height: 80px;
  }
  .prompt-text:focus { outline: none; border-color: #818cf8; color: #e2e8f0; }
  .prompt-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex-shrink: 0;
  }
  .btn-copy {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-copy:hover { border-color: #818cf8; color: #c7d2fe; }
  .btn-copy.copied { border-color: #22c55e; color: #86efac; }

  /* Compare mode */
  .compare-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .compare-header span {
    font-size: 0.8rem;
    font-weight: 600;
    color: #e2e8f0;
  }
  .compare-back-btn {
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    cursor: pointer;
  }
  .compare-back-btn:hover {
    border-color: #818cf8;
    color: #c7d2fe;
  }
  .compare-container {
    display: grid;
    flex: 1;
    min-height: 0;
    gap: 2px;
  }
  .compare-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #0f172a;
  }
  .compare-label {
    padding: 0.4rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 600;
    color: #818cf8;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    text-align: center;
  }
  .compare-iframe {
    flex: 1;
    border: none;
    background: #fff;
  }
  .compare-not-found {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 0.8rem;
  }
  .compare-footer {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    color: #64748b;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    text-align: center;
    flex-shrink: 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <span class="top-bar-title">Tinker Factory</span>
    <select class="proto-select" id="proto-select" onchange="selectProtoFromDropdown(this.value)">
      <option value="">Loading slots...</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div class="presets" id="presets"></div>
    <div class="status-dot" id="status-dot">
      <span class="status-dot-circle"></span>
      <span class="status-dot-label">Connecting...</span>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Controls -->
  <div class="controls">
    <div class="controls-section">
      <div class="controls-section-title">Prototype</div>

      <div class="control-group">
        <label class="control-label">Layout</label>
        <select class="control-select" id="ctrl-layout" onchange="set('layout', this.value)">
          <option value="single-column">Single Column</option>
          <option value="two-column">Two Column</option>
          <option value="sidebar">Sidebar</option>
          <option value="full-width">Full Width</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Density</label>
        <select class="control-select" id="ctrl-density" onchange="set('density', this.value)">
          <option value="spacious">Spacious</option>
          <option value="balanced">Balanced</option>
          <option value="compact">Compact</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Hero Style</label>
        <select class="control-select" id="ctrl-heroStyle" onchange="set('heroStyle', this.value)">
          <option value="minimal">Minimal</option>
          <option value="gradient">Gradient</option>
          <option value="image">Image</option>
          <option value="split">Split</option>
          <option value="none">None</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Navigation</label>
        <select class="control-select" id="ctrl-navStyle" onchange="set('navStyle', this.value)">
          <option value="top-bar">Top Bar</option>
          <option value="sidebar">Sidebar</option>
          <option value="tabs">Tabs</option>
          <option value="none">None</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Sections <span class="control-value" id="sections-value">4</span></label>
        <input class="control-range" id="ctrl-sectionCount" type="range" min="1" max="8" step="1" value="4"
          oninput="set('sectionCount', parseInt(this.value)); document.getElementById('sections-value').textContent = this.value">
        <div class="control-range-labels"><span>1</span><span>8</span></div>
      </div>

      <div class="control-group">
        <label class="control-label">Tone</label>
        <select class="control-select" id="ctrl-contentTone" onchange="set('contentTone', this.value)">
          <option value="clinical">Clinical</option>
          <option value="friendly">Friendly</option>
          <option value="technical">Technical</option>
          <option value="marketing">Marketing</option>
        </select>
      </div>
    </div>

    <div class="controls-section">
      <div class="controls-section-title">Shared</div>

      <div class="control-group">
        <label class="control-label">Color Scheme</label>
        <select class="control-select" id="ctrl-colorScheme" onchange="set('colorScheme', this.value)">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Viewport</label>
        <select class="control-select" id="ctrl-viewport" onchange="set('viewport', this.value)">
          <option value="desktop">Desktop</option>
          <option value="tablet">Tablet</option>
          <option value="mobile">Mobile</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Spacing Scale <span class="control-value" id="spacing-value">1.0</span></label>
        <input class="control-range" id="ctrl-spacingScale" type="range" min="0.5" max="2.0" step="0.25" value="1.0"
          oninput="set('spacingScale', parseFloat(this.value)); document.getElementById('spacing-value').textContent = parseFloat(this.value).toFixed(1)">
        <div class="control-range-labels"><span>0.5x</span><span>2.0x</span></div>
      </div>

      <div class="control-group">
        <label class="control-label">Border Radius <span class="control-value" id="radius-value">8px</span></label>
        <input class="control-range" id="ctrl-borderRadius" type="range" min="0" max="24" step="2" value="8"
          oninput="set('borderRadius', parseInt(this.value)); document.getElementById('radius-value').textContent = this.value + 'px'">
        <div class="control-range-labels"><span>0px</span><span>24px</span></div>
      </div>
    </div>

    <div class="controls-section">
      <div class="controls-section-title">Slots</div>
      <div id="slots-sidebar-content">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Preview area -->
  <div class="preview-area">
    <div id="preview-container" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div class="preview-placeholder" id="preview-placeholder">
        <p id="preview-placeholder-msg">Loading prototypes...</p>
      </div>
    </div>

    <!-- Slots bar -->
    <div class="slots-bar" id="slots-bar">
      <!-- Populated by JS from /api/slots -->
    </div>
  </div>
</div>

<!-- Prompt Bar -->
<div class="prompt-bar">
  <textarea class="prompt-text" id="prompt-text" rows="2" placeholder="Adjust controls to generate a prompt..."></textarea>
  <div class="prompt-buttons">
    <button class="btn-copy" id="btn-copy" onclick="copyPrompt()">Copy</button>
  </div>
</div>

<script>
// --- State ---
var DEFAULTS = {
  layout: 'single-column',
  density: 'balanced',
  heroStyle: 'minimal',
  navStyle: 'top-bar',
  sectionCount: 4,
  contentTone: 'clinical',
  colorScheme: 'dark',
  viewport: 'desktop',
  spacingScale: 1.0,
  borderRadius: 8,
};

var state = Object.assign({}, DEFAULTS);
var activePreset = null;
var activeFile = null;
var allSlots = [];
var compareMode = false;
var compareItems = [];

// --- Presets ---
var PRESETS = {
  'Minimal': {
    layout: 'single-column', density: 'spacious', heroStyle: 'minimal',
    navStyle: 'none', sectionCount: 3, contentTone: 'clinical',
    colorScheme: 'light', viewport: 'desktop', spacingScale: 1.25, borderRadius: 12
  },
  'Bold Hero': {
    layout: 'full-width', density: 'balanced', heroStyle: 'gradient',
    navStyle: 'top-bar', sectionCount: 5, contentTone: 'marketing',
    colorScheme: 'dark', viewport: 'desktop', spacingScale: 1.0, borderRadius: 8
  },
  'Dense Dashboard': {
    layout: 'sidebar', density: 'compact', heroStyle: 'none',
    navStyle: 'sidebar', sectionCount: 7, contentTone: 'technical',
    colorScheme: 'dark', viewport: 'desktop', spacingScale: 0.75, borderRadius: 4
  },
  'Magazine': {
    layout: 'two-column', density: 'spacious', heroStyle: 'image',
    navStyle: 'top-bar', sectionCount: 6, contentTone: 'friendly',
    colorScheme: 'light', viewport: 'desktop', spacingScale: 1.0, borderRadius: 16
  }
};

// --- Render presets ---
var presetsEl = document.getElementById('presets');
Object.keys(PRESETS).forEach(function(name) {
  var btn = document.createElement('button');
  btn.className = 'preset-btn';
  btn.textContent = name;
  btn.dataset.preset = name;
  btn.onclick = function() { applyPreset(name); };
  presetsEl.appendChild(btn);
});

syncControlsToState();
updateAll();

// --- Tinker functions ---
function set(key, value) {
  state[key] = value;
  activePreset = null;
  updatePresetButtons();
  updateAll();
  emitTinkerEvent();
}

function updateAll() {
  updatePrompt();
}

function updatePrompt() {
  var parts = [];
  if (state.layout !== DEFAULTS.layout) parts.push(state.layout.replace(/-/g, ' ') + ' layout');
  if (state.density !== DEFAULTS.density) parts.push(state.density + ' density');
  if (state.heroStyle !== DEFAULTS.heroStyle) parts.push(state.heroStyle + ' hero');
  if (state.navStyle !== DEFAULTS.navStyle) parts.push(state.navStyle.replace(/-/g, ' ') + ' navigation');
  if (state.sectionCount !== DEFAULTS.sectionCount) parts.push(state.sectionCount + ' sections');
  if (state.contentTone !== DEFAULTS.contentTone) parts.push(state.contentTone + ' tone');
  if (state.colorScheme !== DEFAULTS.colorScheme) parts.push(state.colorScheme + ' color scheme');
  if (state.viewport !== DEFAULTS.viewport) parts.push(state.viewport + ' viewport');
  if (state.spacingScale !== DEFAULTS.spacingScale) parts.push(state.spacingScale.toFixed(1) + 'x spacing');
  if (state.borderRadius !== DEFAULTS.borderRadius) parts.push(state.borderRadius + 'px border radius');

  var promptEl = document.getElementById('prompt-text');
  if (parts.length === 0) {
    promptEl.value = 'Using defaults \u2014 adjust controls to generate a prompt.';
  } else {
    promptEl.value = 'Iterate with ' + parts.join(', ') + '.';
  }
}

function applyPreset(name) {
  var preset = PRESETS[name];
  if (!preset) return;
  Object.assign(state, preset);
  activePreset = name;
  syncControlsToState();
  updatePresetButtons();
  updateAll();
  emitTinkerEvent();
}

function syncControlsToState() {
  document.getElementById('ctrl-layout').value = state.layout;
  document.getElementById('ctrl-density').value = state.density;
  document.getElementById('ctrl-heroStyle').value = state.heroStyle;
  document.getElementById('ctrl-navStyle').value = state.navStyle;
  document.getElementById('ctrl-sectionCount').value = state.sectionCount;
  document.getElementById('sections-value').textContent = state.sectionCount;
  document.getElementById('ctrl-contentTone').value = state.contentTone;
  document.getElementById('ctrl-colorScheme').value = state.colorScheme;
  document.getElementById('ctrl-viewport').value = state.viewport;
  document.getElementById('ctrl-spacingScale').value = state.spacingScale;
  document.getElementById('spacing-value').textContent = state.spacingScale.toFixed(1);
  document.getElementById('ctrl-borderRadius').value = state.borderRadius;
  document.getElementById('radius-value').textContent = state.borderRadius + 'px';
}

function updatePresetButtons() {
  var buttons = document.querySelectorAll('.preset-btn');
  for (var i = 0; i < buttons.length; i++) {
    var btn = buttons[i];
    if (btn.dataset.preset === activePreset) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }
}

function copyPrompt() {
  var text = document.getElementById('prompt-text').value;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('btn-copy');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = 'Copy';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// --- Prototype preview ---
function setPreview(filePath) {
  if (!filePath) return;
  activeFile = filePath;

  var container = document.getElementById('preview-container');
  var placeholder = document.getElementById('preview-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  var existing = container.querySelector('.preview-iframe');
  var url = '/prototype?file=' + encodeURIComponent(filePath);
  if (existing) {
    existing.src = url;
  } else {
    var iframe = document.createElement('iframe');
    iframe.className = 'preview-iframe';
    iframe.src = url;
    container.appendChild(iframe);
  }

  // Sync dropdown selection
  var select = document.getElementById('proto-select');
  for (var i = 0; i < select.options.length; i++) {
    if (select.options[i].value === filePath) {
      select.selectedIndex = i;
      break;
    }
  }

  updateActivePills(filePath);
}

function selectProtoFromDropdown(filePath) {
  if (!filePath) return;
  setPreview(filePath);
  // Find slot/iteration for this file and send WS event
  for (var s = 0; s < allSlots.length; s++) {
    var slotData = allSlots[s];
    for (var it = 0; it < slotData.iterations.length; it++) {
      var iter = slotData.iterations[it];
      if (iter.file === filePath) {
        sendEvent({ type: 'select', slot: slotData.slot, iteration: iter.slug.split('--')[1] || iter.slug });
        return;
      }
    }
  }
}

function updateActivePills(filePath) {
  var pills = document.querySelectorAll('.slot-pill, .slot-sidebar-pill');
  for (var i = 0; i < pills.length; i++) {
    if (pills[i].dataset.file === filePath) {
      pills[i].classList.add('active');
    } else {
      pills[i].classList.remove('active');
    }
  }
}

function selectSlotIteration(slotName, iterSlug, filePath) {
  setPreview(filePath);
  sendEvent({ type: 'select', slot: slotName, iteration: iterSlug.split('--')[1] || iterSlug });
}

// --- Slot rendering ---
function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function makeText(tag, className, text) {
  var el = document.createElement(tag);
  el.className = className;
  el.textContent = text;
  return el;
}

function renderSlots(slots) {
  allSlots = slots;

  var slotsBar = document.getElementById('slots-bar');
  var sidebarContent = document.getElementById('slots-sidebar-content');
  var protoSelect = document.getElementById('proto-select');

  clearChildren(slotsBar);
  clearChildren(sidebarContent);
  clearChildren(protoSelect);

  if (!slots || slots.length === 0) {
    var noProto = makeText('span', '', 'No prototypes found');
    noProto.style.fontSize = '0.7rem';
    noProto.style.color = '#475569';
    slotsBar.appendChild(noProto);

    var noOpt = document.createElement('option');
    noOpt.value = '';
    noOpt.textContent = 'No prototypes';
    protoSelect.appendChild(noOpt);

    var ph = document.getElementById('preview-placeholder');
    if (ph) {
      ph.style.display = '';
      document.getElementById('preview-placeholder-msg').textContent = 'No prototype files found in prototypes/';
    }
    return;
  }

  var firstFile = null;

  slots.forEach(function(slotData) {
    var slotName = slotData.slot;
    var iterations = slotData.iterations;

    // ---- Bottom slots bar ----
    var groupEl = document.createElement('div');
    groupEl.className = 'slot-group';

    var nameEl = makeText('span', 'slot-name', slotName);
    groupEl.appendChild(nameEl);

    var pillsEl = document.createElement('div');
    pillsEl.className = 'slot-pills';

    iterations.forEach(function(iter) {
      if (!firstFile) firstFile = iter.file;

      // Bottom pill
      var pill = document.createElement('button');
      pill.className = 'slot-pill';
      pill.textContent = iter.label;
      pill.dataset.file = iter.file;
      pill.title = iter.file;
      (function(sn, slug, file) {
        pill.onclick = function() { selectSlotIteration(sn, slug, file); };
      })(slotName, iter.slug, iter.file);
      pillsEl.appendChild(pill);

      // Dropdown option
      var opt = document.createElement('option');
      opt.value = iter.file;
      opt.textContent = slotName + ' / ' + iter.label;
      protoSelect.appendChild(opt);
    });

    groupEl.appendChild(pillsEl);
    slotsBar.appendChild(groupEl);

    // ---- Sidebar slot group ----
    var sidebarGroup = document.createElement('div');
    sidebarGroup.className = 'slot-sidebar-group';

    sidebarGroup.appendChild(makeText('div', 'slot-sidebar-name', slotName));

    var sidebarPillsEl = document.createElement('div');
    sidebarPillsEl.className = 'slot-sidebar-pills';

    iterations.forEach(function(iter) {
      var pill = document.createElement('button');
      pill.className = 'slot-sidebar-pill';
      pill.textContent = iter.label;
      pill.dataset.file = iter.file;
      pill.title = iter.file;
      (function(sn, slug, file) {
        pill.onclick = function() { selectSlotIteration(sn, slug, file); };
      })(slotName, iter.slug, iter.file);
      sidebarPillsEl.appendChild(pill);
    });

    sidebarGroup.appendChild(sidebarPillsEl);
    sidebarContent.appendChild(sidebarGroup);
  });

  // Select first iteration by default
  if (firstFile) setPreview(firstFile);
}

// --- Load slots on init ---
fetch('/api/slots')
  .then(function(r) { return r.json(); })
  .then(function(slots) { renderSlots(slots); })
  .catch(function(err) {
    var ph = document.getElementById('preview-placeholder');
    if (ph) {
      ph.style.display = '';
      document.getElementById('preview-placeholder-msg').textContent = 'Failed to load slots: ' + err.message;
    }

    var errSpan = makeText('span', '', 'Failed to load slots');
    errSpan.style.fontSize = '0.7rem';
    errSpan.style.color = '#ef4444';
    document.getElementById('slots-bar').appendChild(errSpan);

    var errOpt = document.createElement('option');
    errOpt.value = '';
    errOpt.textContent = 'Error loading';
    document.getElementById('proto-select').appendChild(errOpt);
  });

// --- WebSocket event bridge ---
var ws = null;
var eventQueue = [];

function wsConnect() {
  ws = new WebSocket('ws://' + window.location.host);
  ws.onopen = function() {
    eventQueue.forEach(function(e) { ws.send(JSON.stringify(e)); });
    eventQueue = [];
    var dot = document.getElementById('status-dot');
    dot.className = 'status-dot connected';
    dot.querySelector('.status-dot-label').textContent = 'connected';
    setTimeout(function() {
      dot.querySelector('.status-dot-label').textContent = '';
    }, 2000);
  };
  ws.onmessage = function(msg) {
    var data = JSON.parse(msg.data);
    if (data.type === 'reload') {
      var iframe = document.querySelector('.preview-iframe');
      if (iframe) iframe.src = iframe.src;
    } else if (data.type === 'compare') {
      enterCompareMode(data.items);
    }
  };
  ws.onclose = function() {
    var dot = document.getElementById('status-dot');
    dot.className = 'status-dot';
    dot.querySelector('.status-dot-label').textContent = 'Reconnecting...';
    setTimeout(wsConnect, 1000);
  };
}

function sendEvent(event) {
  event.timestamp = Date.now();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(event));
  } else {
    eventQueue.push(event);
  }
}

var emitTimer = null;
function emitTinkerEvent() {
  clearTimeout(emitTimer);
  emitTimer = setTimeout(function() {
    sendEvent({ type: 'tinker', state: Object.assign({}, state) });
  }, 150);
}

// --- Compare mode ---
var savedChildren = null;

function enterCompareMode(items) {
  compareMode = true;
  compareItems = items;

  var previewArea = document.querySelector('.preview-area');
  // Save original child nodes (preserves event handlers)
  if (!savedChildren) {
    savedChildren = [];
    while (previewArea.firstChild) {
      savedChildren.push(previewArea.removeChild(previewArea.firstChild));
    }
  } else {
    previewArea.innerHTML = '';
  }

  // Header
  var header = document.createElement('div');
  header.className = 'compare-header';

  var title = document.createElement('span');
  title.textContent = 'Compare: ' + items.map(function(i) { return i.label || i.slug; }).join(' vs ');
  header.appendChild(title);

  var backBtn = document.createElement('button');
  backBtn.className = 'compare-back-btn';
  backBtn.textContent = '\u2190 Back';
  backBtn.onclick = exitCompareMode;
  header.appendChild(backBtn);

  previewArea.appendChild(header);

  // Iframes container
  var container = document.createElement('div');
  container.className = 'compare-container';
  container.style.gridTemplateColumns = 'repeat(' + items.length + ', 1fr)';

  items.forEach(function(item) {
    var col = document.createElement('div');
    col.className = 'compare-col';

    var label = document.createElement('div');
    label.className = 'compare-label';
    label.textContent = item.label || item.slug;
    col.appendChild(label);

    if (item.file) {
      var iframe = document.createElement('iframe');
      iframe.className = 'compare-iframe';
      iframe.src = '/prototype?file=' + encodeURIComponent(item.file);
      col.appendChild(iframe);
    } else {
      var notFound = document.createElement('div');
      notFound.className = 'compare-not-found';
      notFound.textContent = 'Not found: ' + item.slug;
      col.appendChild(notFound);
    }

    container.appendChild(col);
  });

  previewArea.appendChild(container);

  // Footer hint
  var footer = document.createElement('div');
  footer.className = 'compare-footer';
  footer.textContent = 'Pick in terminal: triage <slug> done';
  previewArea.appendChild(footer);
}

function exitCompareMode() {
  compareMode = false;
  compareItems = [];
  var previewArea = document.querySelector('.preview-area');
  previewArea.innerHTML = '';
  // Restore saved child nodes (with their event handlers intact)
  if (savedChildren) {
    savedChildren.forEach(function(node) { previewArea.appendChild(node); });
    savedChildren = null;
    // Re-set iframe src since it may have been unloaded
    var iframe = document.querySelector('.preview-iframe');
    if (iframe && activeFile) {
      iframe.src = '/prototype?file=' + encodeURIComponent(activeFile);
    }
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && compareMode) {
    exitCompareMode();
  }
});

wsConnect();
</script>
