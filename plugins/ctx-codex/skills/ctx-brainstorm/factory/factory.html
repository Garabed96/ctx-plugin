<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinker Factory</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0e17;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 1rem;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 0;
    flex: 1;
  }
  .top-bar-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #e2e8f0;
    white-space: nowrap;
  }
  .portfolio-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    padding: 0 0.55rem;
    border: 1px solid #334155;
    border-radius: 4px;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 0.72rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .portfolio-back:hover,
  .portfolio-back:focus {
    border-color: #818cf8;
    color: #c7d2fe;
    outline: none;
  }
  .top-bar-context {
    font-size: 0.75rem;
    color: #818cf8;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .top-bar-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.75rem;
    flex: 0 1 auto;
    min-width: 0;
    margin-left: auto;
  }
  .top-bar-version-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex: 0 1 318px;
    min-width: 210px;
  }
  .proto-select {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    min-width: 0;
    width: 100%;
  }
  .proto-select:focus { outline: none; border-color: #818cf8; }
  .page-nav {
    display: flex;
    gap: 0.3rem;
  }
  .page-nav-btn {
    background: #0f172a;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 4px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.12s;
  }
  .page-nav-btn:hover:not(:disabled) { border-color: #818cf8; color: #c7d2fe; }
  .page-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Viewport pills */
  .viewport-pills {
    display: flex;
    gap: 0.25rem;
  }
  .viewport-pill {
    font-size: 0.7rem;
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #64748b;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .viewport-pill:hover { border-color: #6366f1; color: #a5b4fc; }
  .viewport-pill.active {
    border-color: #818cf8;
    background: #1e1b4b;
    color: #c7d2fe;
    box-shadow: 0 0 0 1px #818cf8;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    color: #64748b;
  }
  .status-dot-circle {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64748b;
    transition: background 0.2s;
  }
  .status-dot.connected .status-dot-circle { background: #22c55e; }
  .status-dot.connected .status-dot-label { color: #86efac; }
  @media (max-width: 920px) {
    .top-bar { gap: 0.65rem; }
    .top-bar-actions { gap: 0.55rem; }
    .top-bar-version-actions { flex-basis: 260px; }
    .status-dot { display: none; }
  }
  @media (max-width: 760px) {
    .top-bar-title { display: none; }
    .top-bar-context { font-size: 0.7rem; }
    .top-bar-version-actions { flex-basis: 210px; min-width: 180px; }
    .viewport-pill { padding: 0.2rem 0.4rem; }
  }

  /* Sidebar toggle (lives in top-bar) */
  .sidebar-toggle {
    background: #0f172a;
    border: 1px solid #334155;
    color: #94a3b8;
    border-radius: 4px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
    padding: 0;
    font-family: inherit;
    transition: all 0.15s;
  }
  .sidebar-toggle:hover { border-color: #818cf8; color: #c7d2fe; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Sidebar */
  .controls {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid #1e293b;
    padding: 1rem;
    overflow-y: auto;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    gap: 0;
    transition: width 0.2s ease, padding 0.2s ease, border-right-width 0.2s ease;
  }
  .controls.collapsed {
    width: 0;
    padding-left: 0;
    padding-right: 0;
    border-right-width: 0;
    overflow: hidden;
  }
  .controls-section {
    margin-bottom: 1.25rem;
  }
  .controls-section-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #64748b;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #1e293b;
  }

  /* Pages section */
  .page-group {
    margin-bottom: 0.55rem;
  }
  .page-group-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.28rem 0.1rem 0.38rem;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .page-group-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #64748b;
  }
  .page-group-meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .page-group-count {
    font-size: 0.6rem;
    color: #475569;
  }
  .page-group-chevron {
    font-size: 0.72rem;
    color: #64748b;
  }
  .page-group-rows {
    display: flex;
    flex-direction: column;
    gap: 0.12rem;
  }
  .page-tools {
    display: grid;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .page-search,
  .page-filter-select {
    width: 100%;
    background: #0a0e17;
    color: #cbd5e1;
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 0.38rem 0.45rem;
    font-size: 0.72rem;
    font-family: inherit;
  }
  .page-search:focus,
  .page-filter-select:focus {
    outline: none;
    border-color: #818cf8;
  }
  .page-tool-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem;
  }
  .page-action-row {
    display: grid;
    gap: 0.35rem;
  }
  .page-mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 0.15rem;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0a0e17;
  }
  .page-tool-btn {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.32rem 0.5rem;
    font-size: 0.68rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .page-mode-toggle .page-tool-btn {
    background: transparent;
  }
  .page-tool-btn:hover,
  .page-tool-btn.active {
    border-color: #818cf8;
    color: #c7d2fe;
  }
  .page-tool-btn:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  #page-rescan {
    width: 100%;
    border-color: #334155;
  }
  .page-edit-row {
    display: grid;
    grid-template-columns: 1fr;
  }
  .page-row.editing {
    align-items: stretch;
    flex-direction: column;
    gap: 0.35rem;
  }
  .page-row-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.35rem;
    min-width: 0;
  }
  .page-row-actions {
    display: none;
    justify-content: flex-end;
  }
  .page-row.editing .page-row-actions {
    display: flex;
  }
  .page-archive-btn {
    background: rgba(248, 113, 113, 0.08);
    color: #fca5a5;
    border: 1px solid rgba(248, 113, 113, 0.28);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.64rem;
    font-weight: 650;
    padding: 0.22rem 0.45rem;
  }
  .page-archive-btn:hover,
  .page-archive-btn:focus {
    border-color: #f87171;
    outline: none;
  }
  .page-results {
    font-size: 0.65rem;
    color: #64748b;
    margin: -0.15rem 0 0.45rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .page-versions {
    display: none;
    padding: 0.45rem 0;
    border-top: 1px solid #1e293b;
    border-bottom: 1px solid #1e293b;
  }
  .page-versions.visible {
    display: block;
  }
  .page-versions-label {
    display: block;
    margin-bottom: 0.35rem;
    color: #64748b;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .page-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.35rem 0.5rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 0.15rem;
  }
  .page-row:hover { background: #1e293b; }
  .page-row.active { background: #1e1b4b; }
  .page-row-name {
    font-size: 0.75rem;
    color: #94a3b8;
    font-family: 'SF Mono', 'Fira Code', monospace;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }
  .page-row.active .page-row-name { color: #c7d2fe; }
  .page-row-count {
    font-size: 0.6rem;
    color: #475569;
    flex-shrink: 0;
    margin-left: 0.35rem;
  }
  .page-row.active .page-row-count { color: #818cf8; }

  /* Versions section */
  .version-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.1rem;
  }
  .version-pill {
    font-size: 0.65rem;
    padding: 0.2rem 0.45rem;
    border-radius: 3px;
    border: 1px solid #334155;
    background: #0a0e17;
    color: #64748b;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .version-pill:hover { border-color: #6366f1; color: #a5b4fc; }
  .version-pill.active {
    border-color: #818cf8;
    background: #1e1b4b;
    color: #c7d2fe;
    box-shadow: 0 0 0 1px #818cf8;
  }

  /* Style Controls section */
  .control-group {
    margin-bottom: 0.6rem;
  }
  .control-label {
    font-size: 0.65rem;
    color: #64748b;
    margin-bottom: 0.25rem;
    display: block;
  }
  .control-color-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .control-color-input {
    width: 24px;
    height: 24px;
    border: 1px solid #334155;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .control-color-input::-webkit-color-swatch-wrapper { padding: 0; }
  .control-color-input::-webkit-color-swatch {
    border: none;
    border-radius: 3px;
  }
  .control-color-input::-moz-color-swatch {
    border: none;
    border-radius: 3px;
  }
  .control-hex {
    font-size: 0.68rem;
    color: #94a3b8;
    font-family: 'SF Mono', 'Fira Code', monospace;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 3px;
    padding: 0.2rem 0.35rem;
    width: 70px;
  }
  .control-hex:focus { outline: none; border-color: #818cf8; color: #e2e8f0; }
  .control-select {
    width: 100%;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 0.3rem 0.4rem;
    font-size: 0.72rem;
    font-family: inherit;
    cursor: pointer;
  }
  .control-select:focus { outline: none; border-color: #818cf8; }
  .control-range {
    width: 100%;
    accent-color: #818cf8;
    cursor: pointer;
  }
  .control-range-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .control-range-value {
    font-size: 0.65rem;
    color: #818cf8;
    font-family: 'SF Mono', 'Fira Code', monospace;
    min-width: 36px;
    text-align: right;
    flex-shrink: 0;
  }
  .controls-divider {
    height: 1px;
    background: #1e293b;
    margin: 0.5rem 0;
  }
  .btn-rescan {
    width: 100%;
    margin-top: 0.35rem;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 0.3rem 0.5rem;
    font-size: 0.68rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    text-align: center;
  }
  .btn-rescan:hover { border-color: #818cf8; color: #c7d2fe; }
  .btn-rescan:disabled { opacity: 0.5; cursor: wait; }
  .btn-reset {
    width: 100%;
    background: transparent;
    color: #475569;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 0.25rem 0.5rem;
    font-size: 0.65rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    text-align: center;
  }
  .btn-reset:hover { color: #94a3b8; border-color: #334155; }
  .style-no-profile {
    font-size: 0.72rem;
    color: #475569;
    font-style: italic;
  }
  .style-controls-note {
    font-size: 0.66rem;
    color: #64748b;
    line-height: 1.4;
    margin: 0 0 0.5rem;
  }
  .empty-hint {
    font-size: 0.72rem;
    color: #475569;
    font-style: italic;
  }

  /* Preview area */
  .preview-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .preview-iframe-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0.75rem 0.75rem 0 0.75rem;
  }
  .preview-iframe {
    flex: 1;
    border: none;
    background: #fff;
    border-radius: 8px;
    transition: max-width 0.2s ease;
  }
  .preview-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px dashed #334155;
    background: #0f172a;
  }
  .preview-placeholder p {
    color: #475569;
    font-size: 0.85rem;
    text-align: center;
    line-height: 1.6;
  }

  /* Compare mode */
  .compare-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .compare-header span {
    font-size: 0.8rem;
    font-weight: 600;
    color: #e2e8f0;
  }
  .compare-back-btn {
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #94a3b8;
    cursor: pointer;
    font-family: inherit;
  }
  .compare-back-btn:hover {
    border-color: #818cf8;
    color: #c7d2fe;
  }
  .compare-container {
    display: grid;
    flex: 1;
    min-height: 0;
    gap: 2px;
  }
  .compare-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #0f172a;
  }
  .compare-label {
    padding: 0.4rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 600;
    color: #818cf8;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    text-align: center;
  }
  .compare-iframe {
    flex: 1;
    border: none;
    background: #fff;
  }
  .compare-not-found {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 0.8rem;
  }
  .compare-footer {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    color: #64748b;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    text-align: center;
    flex-shrink: 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">&#9776;</button>
    <span class="top-bar-title">Tinker Factory</span>
    <a class="portfolio-back" href="/factory" title="Back to factory" aria-label="Back to Factory">&larr; Factory</a>
    <span class="top-bar-context" id="top-bar-context"></span>
  </div>
  <div class="top-bar-actions">
    <div class="top-bar-version-actions">
      <div class="page-nav">
        <button class="page-nav-btn" id="page-prev" onclick="goToAdjacentPage(-1)" title="Previous page" aria-label="Previous page">&larr;</button>
        <button class="page-nav-btn" id="page-next" onclick="goToAdjacentPage(1)" title="Next page" aria-label="Next page">&rarr;</button>
      </div>
      <select class="proto-select" id="proto-select" onchange="selectProtoFromDropdown(this.value)">
        <option value="">Loading slots...</option>
      </select>
    </div>
    <div class="viewport-pills" id="viewport-pills">
      <button class="viewport-pill active" data-viewport="desktop" onclick="setViewport('desktop')">Desktop</button>
      <button class="viewport-pill" data-viewport="tablet" onclick="setViewport('tablet')">Tablet</button>
      <button class="viewport-pill" data-viewport="mobile" onclick="setViewport('mobile')">Mobile</button>
    </div>
    <div class="status-dot" id="status-dot">
      <span class="status-dot-circle"></span>
      <span class="status-dot-label">Connecting...</span>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Sidebar -->
  <div class="controls" id="controls">

    <!-- Pages section -->
    <div class="controls-section">
      <div class="controls-section-title">Pages</div>
      <div class="page-tools">
        <input class="page-search" id="page-search" type="search" placeholder="Search pages..." oninput="updatePageFilters()" />
        <div class="page-tool-row">
          <select class="page-filter-select" id="page-category-filter" onchange="updatePageFilters()">
            <option value="">All categories</option>
          </select>
          <select class="page-filter-select" id="page-sort" onchange="updatePageFilters()">
            <option value="updated-desc">Newest</option>
            <option value="updated-asc">Oldest</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
            <option value="category-asc">Category A-Z</option>
          </select>
        </div>
        <div class="page-action-row">
          <div class="page-mode-toggle" role="group" aria-label="Page group display mode">
            <button class="page-tool-btn active" id="page-compact" type="button" onclick="setPageGroupMode('compact')" aria-pressed="true">Compact</button>
            <button class="page-tool-btn" id="page-expand" type="button" onclick="setPageGroupMode('expanded')" aria-pressed="false">Expand</button>
          </div>
          <button class="page-tool-btn btn-rescan" id="page-rescan" type="button" onclick="triggerRescan()">Re-scan project</button>
        </div>
        <div class="page-edit-row">
          <button class="page-tool-btn" id="page-edit-toggle" type="button" onclick="togglePageEditMode()" aria-pressed="false">Edit pages</button>
        </div>
        <div class="page-versions" id="versions-section">
          <span class="page-versions-label">Versions</span>
          <div class="version-pills" id="version-pills">
            <!-- Populated by JS -->
          </div>
        </div>
        <div class="page-results" id="page-results"></div>
      </div>
      <div id="pages-list">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Style Controls section -->
    <div class="controls-section">
      <div class="controls-section-title">Style Controls</div>
      <div id="style-controls-content">
        <span class="style-no-profile">Loading profile...</span>
      </div>
    </div>

  </div>

  <!-- Preview area -->
  <div class="preview-area">
    <div id="preview-container" class="preview-iframe-wrapper">
      <div class="preview-placeholder" id="preview-placeholder">
        <p id="preview-placeholder-msg">Loading prototypes...</p>
      </div>
    </div>
  </div>
</div>

<script>
// --- State ---
var activeFile = null;
var activePage = null;
var activeVersion = null;
var allSlots = [];
var compareMode = false;
var compareItems = [];
var currentViewport = 'desktop';
var expandedGroups = {};
var pageGroupMode = 'compact';
var pageEditMode = false;
var previewFileBase = '/prototype?file=';
var pageFilters = { query: '', category: '', sort: 'updated-desc' };

// --- Sidebar collapse ---
// Default collapsed; user preference persisted in localStorage.
function toggleSidebar() {
  var controls = document.getElementById('controls');
  var collapsed = controls.classList.toggle('collapsed');
  try {
    localStorage.setItem('factorySidebarCollapsed', collapsed ? '1' : '0');
  } catch (e) { /* storage unavailable */ }
}

(function initSidebar() {
  var controls = document.getElementById('controls');
  if (!controls) return;
  var saved = null;
  try { saved = localStorage.getItem('factorySidebarCollapsed'); } catch (e) {}
  // Default collapsed unless user has explicitly expanded (saved === '0').
  if (saved !== '0') {
    controls.classList.add('collapsed');
  }
})();

// --- DOM helpers ---
function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function makeText(tag, className, text) {
  var el = document.createElement(tag);
  if (className) el.className = className;
  el.textContent = text;
  return el;
}

function buildPreviewUrl(filePath) {
  return previewFileBase + encodeURIComponent(filePath);
}

function findSlot(slotName) {
  for (var i = 0; i < allSlots.length; i++) {
    if (allSlots[i].slot === slotName) return allSlots[i];
  }
  return null;
}

function getGroupName(slotData) {
  return slotData && slotData.group ? slotData.group : 'Ungrouped';
}

function getPageLabel(slotData) {
  return slotData ? (slotData.page || slotData.slot) : '';
}

function getPageContextLabel(slotData) {
  if (!slotData) return '';
  return getGroupName(slotData) === 'Ungrouped'
    ? getPageLabel(slotData)
    : getGroupName(slotData) + ' / ' + getPageLabel(slotData);
}

function compareText(a, b) {
  return String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
}

function getFilteredSortedSlots() {
  var query = (pageFilters.query || '').trim().toLowerCase();
  var category = pageFilters.category || '';
  var slots = allSlots.slice();

  slots = slots.filter(function(slotData) {
    var groupName = getGroupName(slotData);
    var pageLabel = getPageLabel(slotData);
    var matchesCategory = !category || groupName === category;
    var haystack = [
      groupName,
      pageLabel,
      slotData.slot,
      (slotData.iterations || []).map(function(iter) {
        return [iter.label, iter.file].join(' ');
      }).join(' ')
    ].join(' ').toLowerCase();
    return matchesCategory && (!query || haystack.indexOf(query) !== -1);
  });

  slots.sort(function(a, b) {
    if (pageFilters.sort === 'updated-asc') return (a.updatedAt || 0) - (b.updatedAt || 0);
    if (pageFilters.sort === 'name-asc') return compareText(getPageLabel(a), getPageLabel(b));
    if (pageFilters.sort === 'name-desc') return compareText(getPageLabel(b), getPageLabel(a));
    if (pageFilters.sort === 'category-asc') {
      var groupCompare = compareText(getGroupName(a), getGroupName(b));
      return groupCompare || compareText(getPageLabel(a), getPageLabel(b));
    }
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });

  return slots;
}

function updatePageFilterOptions() {
  var select = document.getElementById('page-category-filter');
  if (!select) return;
  var current = select.value;
  var groups = [];
  var seen = {};
  allSlots.forEach(function(slotData) {
    var groupName = getGroupName(slotData);
    if (!seen[groupName]) {
      seen[groupName] = true;
      groups.push(groupName);
    }
  });
  groups.sort(compareText);
  clearChildren(select);
  var allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = 'All categories';
  select.appendChild(allOpt);
  groups.forEach(function(groupName) {
    var opt = document.createElement('option');
    opt.value = groupName;
    opt.textContent = groupName;
    select.appendChild(opt);
  });
  select.value = seen[current] ? current : '';
  pageFilters.category = select.value;
}

function updatePageFilters() {
  var search = document.getElementById('page-search');
  var category = document.getElementById('page-category-filter');
  var sort = document.getElementById('page-sort');
  pageFilters.query = search ? search.value : '';
  pageFilters.category = category ? category.value : '';
  pageFilters.sort = sort ? sort.value : 'updated-desc';
  renderPagesList();
  updatePageNavButtons();
}

function getActiveGroupName() {
  var activeSlot = findSlot(activePage);
  return getGroupName(activeSlot);
}

function updatePageGroupModeButtons() {
  var compact = document.getElementById('page-compact');
  var expand = document.getElementById('page-expand');
  if (compact) compact.classList.toggle('active', pageGroupMode === 'compact');
  if (expand) expand.classList.toggle('active', pageGroupMode === 'expanded');
  if (compact) compact.setAttribute('aria-pressed', pageGroupMode === 'compact' ? 'true' : 'false');
  if (expand) expand.setAttribute('aria-pressed', pageGroupMode === 'expanded' ? 'true' : 'false');
}

function setPageGroupMode(mode) {
  pageGroupMode = mode === 'expanded' ? 'expanded' : 'compact';
  var activeGroup = getActiveGroupName();
  var groups = {};
  allSlots.forEach(function(slotData) {
    groups[getGroupName(slotData)] = true;
  });
  Object.keys(groups).forEach(function(groupName) {
    expandedGroups[groupName] = pageGroupMode === 'expanded' || groupName === activeGroup;
  });
  updatePageGroupModeButtons();
  renderPagesList();
}

function updatePageEditButton() {
  var btn = document.getElementById('page-edit-toggle');
  if (!btn) return;
  btn.classList.toggle('active', pageEditMode);
  btn.setAttribute('aria-pressed', pageEditMode ? 'true' : 'false');
  btn.textContent = pageEditMode ? 'Done editing' : 'Edit pages';
}

function togglePageEditMode() {
  pageEditMode = !pageEditMode;
  updatePageEditButton();
  renderPagesList();
}

function updatePageNavButtons() {
  var prev = document.getElementById('page-prev');
  var next = document.getElementById('page-next');
  var index = -1;

  var visibleSlots = getFilteredSortedSlots();
  for (var i = 0; i < visibleSlots.length; i++) {
    if (visibleSlots[i].slot === activePage) {
      index = i;
      break;
    }
  }

  prev.disabled = index <= 0;
  next.disabled = index === -1 || index >= visibleSlots.length - 1;
}

function goToAdjacentPage(direction) {
  if (!activePage) return;
  var visibleSlots = getFilteredSortedSlots();
  for (var i = 0; i < visibleSlots.length; i++) {
    if (visibleSlots[i].slot === activePage) {
      var target = visibleSlots[i + direction];
      if (target) activatePage(target.slot, true);
      return;
    }
  }
}

function renderProtoSelect() {
  var protoSelect = document.getElementById('proto-select');
  clearChildren(protoSelect);

  var slotData = findSlot(activePage);
  if (!slotData) {
    var emptyOpt = document.createElement('option');
    emptyOpt.value = '';
    emptyOpt.textContent = 'Select a page';
    protoSelect.appendChild(emptyOpt);
    return;
  }

  slotData.iterations.forEach(function(iter) {
    var opt = document.createElement('option');
    opt.value = iter.file;
    opt.textContent = iter.label;
    if (iter.file === activeFile) opt.selected = true;
    protoSelect.appendChild(opt);
  });
}

// --- Viewport ---
function setViewport(v) {
  currentViewport = v;
  var pills = document.querySelectorAll('.viewport-pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].classList.toggle('active', pills[i].dataset.viewport === v);
  }
  var iframe = document.querySelector('.preview-iframe');
  if (!iframe) return;
  if (v === 'desktop') {
    iframe.style.maxWidth = '100%';
    iframe.style.marginLeft = '';
    iframe.style.marginRight = '';
  } else if (v === 'tablet') {
    iframe.style.maxWidth = '768px';
    iframe.style.marginLeft = 'auto';
    iframe.style.marginRight = 'auto';
  } else {
    iframe.style.maxWidth = '375px';
    iframe.style.marginLeft = 'auto';
    iframe.style.marginRight = 'auto';
  }
}

// --- Top bar context ---
function updateTopBarContext() {
  var ctx = document.getElementById('top-bar-context');
  var slotData = findSlot(activePage);
  if (slotData && activeVersion) {
    ctx.textContent = getPageContextLabel(slotData) + ' / ' + activeVersion;
  } else if (slotData) {
    ctx.textContent = getPageContextLabel(slotData);
  } else {
    ctx.textContent = '';
  }
}

// --- Prototype preview ---
function setPreview(filePath) {
  if (!filePath) return;
  activeFile = filePath;

  var container = document.getElementById('preview-container');
  var placeholder = document.getElementById('preview-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  var existing = container.querySelector('.preview-iframe');
  var url = buildPreviewUrl(filePath);
  if (existing) {
    existing.src = url;
  } else {
    var iframe = document.createElement('iframe');
    iframe.className = 'preview-iframe';
    iframe.src = url;
    iframe.style.flex = '1';
    iframe.style.border = 'none';
    iframe.style.background = '#fff';
    iframe.style.borderRadius = '8px';
    container.appendChild(iframe);
    setViewport(currentViewport);
    hookIframeLoad();
  }

  // Sync dropdown selection
  var select = document.getElementById('proto-select');
  for (var i = 0; i < select.options.length; i++) {
    if (select.options[i].value === filePath) {
      select.selectedIndex = i;
      break;
    }
  }

  updateVersionPills();
  updateTopBarContext();
}

function selectProtoFromDropdown(filePath) {
  if (!filePath) return;
  var slotData = findSlot(activePage);
  if (!slotData) return;
  for (var it = 0; it < slotData.iterations.length; it++) {
    var iter = slotData.iterations[it];
    if (iter.file === filePath) {
      activeVersion = iter.label;
      setPreview(filePath);
      sendEvent({ type: 'select', slot: slotData.slot, iteration: iter.slug.split('--')[1] || iter.slug });
      return;
    }
  }
}

function toggleGroup(groupName) {
  expandedGroups[groupName] = !expandedGroups[groupName];
  renderPagesList();
}

function renderPagesList() {
  var pagesList = document.getElementById('pages-list');
  clearChildren(pagesList);

  if (!allSlots || allSlots.length === 0) {
    pagesList.appendChild(makeText('span', 'empty-hint', 'No prototype pages found'));
    return;
  }

  var visibleSlots = getFilteredSortedSlots();
  var results = document.getElementById('page-results');
  if (results) {
    results.textContent = visibleSlots.length + ' of ' + allSlots.length + ' pages';
  }

  if (visibleSlots.length === 0) {
    pagesList.appendChild(makeText('span', 'empty-hint', 'No pages match the current filters'));
    return;
  }

  var grouped = {};
  var order = [];
  visibleSlots.forEach(function(slotData) {
    var groupName = getGroupName(slotData);
    if (!grouped[groupName]) {
      grouped[groupName] = [];
      order.push(groupName);
      if (expandedGroups[groupName] == null) {
        expandedGroups[groupName] = pageGroupMode === 'expanded' || groupName === getActiveGroupName();
      }
    }
    grouped[groupName].push(slotData);
  });

  order.forEach(function(groupName) {
    var group = document.createElement('div');
    group.className = 'page-group';

    var header = document.createElement('button');
    header.className = 'page-group-header';
    header.type = 'button';
    header.onclick = function() { toggleGroup(groupName); };

    header.appendChild(makeText('span', 'page-group-title', groupName));

    var meta = document.createElement('span');
    meta.className = 'page-group-meta';
    meta.appendChild(makeText('span', 'page-group-count', grouped[groupName].length + ''));
    meta.appendChild(makeText('span', 'page-group-chevron', expandedGroups[groupName] ? '\u25be' : '\u25b8'));
    header.appendChild(meta);
    group.appendChild(header);

    var rows = document.createElement('div');
    rows.className = 'page-group-rows';
    rows.style.display = expandedGroups[groupName] ? '' : 'none';

    grouped[groupName].forEach(function(slotData) {
      var row = document.createElement('div');
      row.className = 'page-row' + (slotData.slot === activePage ? ' active' : '') + (pageEditMode ? ' editing' : '');
      row.dataset.slot = slotData.slot;

      var rowMain = document.createElement('div');
      rowMain.className = 'page-row-main';
      rowMain.appendChild(makeText('span', 'page-row-name', getPageLabel(slotData)));
      rowMain.appendChild(makeText('span', 'page-row-count', slotData.iterations.length + ''));
      rowMain.onclick = function() { activatePage(slotData.slot, true); };
      row.appendChild(rowMain);

      var actions = document.createElement('div');
      actions.className = 'page-row-actions';
      var archiveBtn = document.createElement('button');
      archiveBtn.className = 'page-archive-btn';
      archiveBtn.type = 'button';
      archiveBtn.textContent = 'Archive page';
      archiveBtn.onclick = function(event) {
        event.stopPropagation();
        archivePage(slotData);
      };
      actions.appendChild(archiveBtn);
      row.appendChild(actions);

      rows.appendChild(row);
    });

    group.appendChild(rows);
    pagesList.appendChild(group);
  });
}

function selectInitialPage() {
  var target = window.__factoryPage;
  if (target && findSlot(target)) {
    activatePage(target, true);
    return;
  }
  var visibleSlots = getFilteredSortedSlots();
  if (visibleSlots.length > 0) {
    activatePage(visibleSlots[0].slot, true);
  } else {
    updatePageNavButtons();
  }
}

// --- Pages ---
function activatePage(slotName, autoSelectLatest) {
  var slotData = findSlot(slotName);
  if (!slotData) return;

  activePage = slotName;
  if (pageGroupMode === 'compact') {
    var activeGroup = getGroupName(slotData);
    Object.keys(expandedGroups).forEach(function(groupName) {
      expandedGroups[groupName] = groupName === activeGroup;
    });
    expandedGroups[activeGroup] = true;
  }
  renderPagesList();

  var versionsSection = document.getElementById('versions-section');
  versionsSection.classList.add('visible');
  renderVersionPills(slotName);
  renderProtoSelect();
  updatePageNavButtons();

  if (autoSelectLatest && slotData.iterations.length > 0) {
    var last = slotData.iterations[slotData.iterations.length - 1];
    activeVersion = last.label;
    setPreview(last.file);
    sendEvent({ type: 'select', slot: slotName, iteration: last.slug.split('--')[1] || last.slug });
    return;
  }

  updateVersionPills();
  updateTopBarContext();
}

function renderVersionPills(slotName) {
  var pillsEl = document.getElementById('version-pills');
  clearChildren(pillsEl);

  var slotData = findSlot(slotName);
  if (!slotData) return;

  slotData.iterations.forEach(function(iter) {
    var pill = document.createElement('button');
    pill.className = 'version-pill' + (iter.label === activeVersion ? ' active' : '');
    pill.textContent = iter.label;
    pill.dataset.file = iter.file;
    pill.dataset.label = iter.label;
    pill.title = iter.file;
    pill.onclick = function() {
      activeVersion = iter.label;
      setPreview(iter.file);
      sendEvent({ type: 'select', slot: slotName, iteration: iter.slug.split('--')[1] || iter.slug });
    };
    pillsEl.appendChild(pill);
  });
}

function updateVersionPills() {
  var pills = document.querySelectorAll('.version-pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].classList.toggle('active', pills[i].dataset.file === activeFile);
  }
}

function loadSlots() {
  return fetch('/api/slots')
    .then(function(r) { return r.json(); })
    .then(function(slots) {
      renderSlots(slots);
      return slots;
    })
    .catch(function(err) {
      var ph = document.getElementById('preview-placeholder');
      if (ph) {
        ph.style.display = '';
        document.getElementById('preview-placeholder-msg').textContent = 'Failed to load slots: ' + err.message;
      }
      var errOpt = document.createElement('option');
      errOpt.value = '';
      errOpt.textContent = 'Error loading';
      document.getElementById('proto-select').appendChild(errOpt);
      updatePageNavButtons();
      return [];
    });
}

function archivePage(slotData) {
  if (!slotData) return;
  var label = getPageContextLabel(slotData);
  var confirmed = window.confirm('Archive page: ' + label + '?\\n\\nThis moves it to factory/archive so it can be restored manually.');
  if (!confirmed) return;

  fetch('/api/archive-page', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ page: slotData.slot })
  })
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
    .then(function(result) {
      if (!result.ok) throw new Error(result.data && result.data.error ? result.data.error : 'Archive failed');
      if (slotData.slot === activePage) {
        window.location.href = '/factory';
        return;
      }
      loadSlots();
    })
    .catch(function(err) {
      window.alert('Could not archive page: ' + err.message);
    });
}

// --- Slot rendering ---
function renderSlots(slots) {
  allSlots = slots || [];
  updatePageFilterOptions();

  var protoSelect = document.getElementById('proto-select');
  var versionsSection = document.getElementById('versions-section');

  activeFile = null;
  activePage = null;
  activeVersion = null;

  clearChildren(protoSelect);
  versionsSection.classList.remove('visible');
  clearChildren(document.getElementById('version-pills'));
  renderPagesList();

  if (!allSlots.length) {
    var noOpt = document.createElement('option');
    noOpt.value = '';
    noOpt.textContent = 'No prototypes';
    protoSelect.appendChild(noOpt);

    var ph = document.getElementById('preview-placeholder');
    if (ph) {
      ph.style.display = '';
      document.getElementById('preview-placeholder-msg').textContent = 'No prototype files found in factory/pages/';
    }
    updateTopBarContext();
    updatePageNavButtons();
    return;
  }

  selectInitialPage();
}

// --- Load slots ---
loadSlots();

// --- Style Controls ---
var styleProfile = null;
var styleOverrides = {};

// CSS var mapping: profile key → --cp-* var name
var CP_MAP = {
  'primary': '--cp-primary',
  'secondary': '--cp-secondary',
  'accent': '--cp-accent',
  'background': '--cp-bg',
  'foreground': '--cp-fg',
  'muted': '--cp-muted',
  'destructive': '--cp-destructive',
  'font-sans': '--cp-font-sans',
  'font-display': '--cp-font-sans',
  'font-mono': '--cp-font-mono',
  'radius-sm': '--cp-radius-sm',
  'radius-md': '--cp-radius-md',
  'radius-lg': '--cp-radius-lg',
};

// Track current option selection separately from style overrides
var selectedOption = null;

// Debounced style event emitter
var _styleEmitTimer = null;
function emitStyleEvent() {
  clearTimeout(_styleEmitTimer);
  _styleEmitTimer = setTimeout(function() {
    sendEvent({ type: 'style', overrides: Object.assign({}, styleOverrides) });
  }, 150);
}

// Build prompt text from current overrides vs profile defaults
function updateStylePrompt() {
  if (!styleProfile) return;
  var parts = [];
  var pc = styleProfile.colors || {};
  var pt = styleProfile.typography || {};
  var pr = (styleProfile.spacing || {}).radius || {};

  // Color changes
  var colorLabels = { primary: 'primary', accent: 'accent', background: 'background',
    foreground: 'foreground', muted: 'muted', secondary: 'secondary', destructive: 'destructive' };
  for (var ck in colorLabels) {
    if (styleOverrides[ck] && styleOverrides[ck] !== pc[ck]) {
      parts.push(colorLabels[ck] + ' ' + styleOverrides[ck]);
    }
  }

  // Font changes
  var profileDisplay = pt.display || pt.sans || '';
  if (styleOverrides['font-display'] && styleOverrides['font-display'] !== profileDisplay) {
    var fontName = styleOverrides['font-display'].replace(/'/g, '').split(',')[0].trim();
    parts.push(fontName + ' font');
  }
  if (styleOverrides['font-mono'] && styleOverrides['font-mono'] !== (pt.mono || '')) {
    var monoName = styleOverrides['font-mono'].replace(/'/g, '').split(',')[0].trim();
    parts.push(monoName + ' mono');
  }

  // Radius changes
  if (styleOverrides['radius-md'] && styleOverrides['radius-md'] !== (pr.md || '')) {
    parts.push(styleOverrides['radius-md'] + ' radius');
  }

  var promptEl = document.getElementById('prompt-text');
  if (!promptEl) return;
  var segments = [];
  if (selectedOption) segments.push('Selected: ' + selectedOption);
  if (parts.length > 0) segments.push('Iterate with ' + parts.join(', ') + '.');

  if (segments.length === 0) {
    promptEl.value = '';
    promptEl.placeholder = 'Describe what you want to iterate on...';
  } else {
    promptEl.value = segments.join('. ');
  }
}

function onStyleChange() {
  emitStyleEvent();
  updateStylePrompt();
}

function injectVar(cpVar, value) {
  var iframe = document.querySelector('.preview-iframe');
  if (!iframe || !iframe.contentDocument) return;
  try {
    iframe.contentDocument.documentElement.style.setProperty(cpVar, value);
  } catch (e) { /* cross-origin */ }
}

function injectAllOverrides() {
  for (var key in styleOverrides) {
    if (CP_MAP[key]) injectVar(CP_MAP[key], styleOverrides[key]);
  }
}

// Re-inject overrides when iframe reloads
function hookIframeLoad() {
  var iframe = document.querySelector('.preview-iframe');
  if (!iframe) return;
  iframe.addEventListener('load', function() {
    setTimeout(injectAllOverrides, 50);
  });
}

function makeColorControl(label, key, value) {
  var group = document.createElement('div');
  group.className = 'control-group';
  group.appendChild(makeText('label', 'control-label', label));

  var row = document.createElement('div');
  row.className = 'control-color-row';

  var picker = document.createElement('input');
  picker.type = 'color';
  picker.className = 'control-color-input';
  picker.value = value || '#000000';

  var hex = document.createElement('input');
  hex.type = 'text';
  hex.className = 'control-hex';
  hex.value = value || '';
  hex.maxLength = 7;

  picker.addEventListener('input', function() {
    hex.value = picker.value;
    styleOverrides[key] = picker.value;
    if (CP_MAP[key]) injectVar(CP_MAP[key], picker.value);
    onStyleChange();
  });

  hex.addEventListener('change', function() {
    var v = hex.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      picker.value = v;
      styleOverrides[key] = v;
      if (CP_MAP[key]) injectVar(CP_MAP[key], v);
      onStyleChange();
    }
  });

  row.appendChild(picker);
  row.appendChild(hex);
  group.appendChild(row);
  return group;
}

function makeFontControl(label, key, value) {
  var group = document.createElement('div');
  group.className = 'control-group';
  group.appendChild(makeText('label', 'control-label', label));

  var select = document.createElement('select');
  select.className = 'control-select';

  // Extract first font name from value for display
  var fonts = [
    { label: 'Profile default', value: value || '' },
    { label: 'System UI', value: 'system-ui, -apple-system, sans-serif' },
    { label: 'Inter', value: "'Inter', system-ui, sans-serif" },
    { label: 'Syne', value: "'Syne', sans-serif" },
    { label: 'DM Mono', value: "'DM Mono', monospace" },
    { label: 'JetBrains Mono', value: "'JetBrains Mono', monospace" },
    { label: 'Georgia', value: "Georgia, 'Times New Roman', serif" },
  ];

  fonts.forEach(function(f) {
    var opt = document.createElement('option');
    opt.value = f.value;
    opt.textContent = f.label;
    if (f.value === value) opt.selected = true;
    select.appendChild(opt);
  });

  select.addEventListener('change', function() {
    styleOverrides[key] = select.value;
    if (CP_MAP[key]) injectVar(CP_MAP[key], select.value);
    onStyleChange();
  });

  group.appendChild(select);
  return group;
}

function makeRadiusControl(label, key, value) {
  var group = document.createElement('div');
  group.className = 'control-group';
  group.appendChild(makeText('label', 'control-label', label));

  var row = document.createElement('div');
  row.className = 'control-range-row';

  var numVal = parseFloat(value) || 0.5;

  var range = document.createElement('input');
  range.type = 'range';
  range.className = 'control-range';
  range.min = '0';
  range.max = '1.5';
  range.step = '0.0625';
  range.value = numVal;

  var display = document.createElement('span');
  display.className = 'control-range-value';
  display.textContent = numVal + 'rem';

  range.addEventListener('input', function() {
    var v = parseFloat(range.value).toFixed(3).replace(/\.?0+$/, '') + 'rem';
    display.textContent = v;
    styleOverrides[key] = v;
    if (CP_MAP[key]) injectVar(CP_MAP[key], v);
    onStyleChange();
  });

  row.appendChild(range);
  row.appendChild(display);
  group.appendChild(row);
  return group;
}

function buildStyleControls(profile) {
  var container = document.getElementById('style-controls-content');
  clearChildren(container);

  if (!profile) {
    container.appendChild(makeText('span', 'style-no-profile', 'No profile found. Use Re-scan project above to refresh styles.'));
    return;
  }

  styleProfile = profile;
  var c = profile.colors || {};
  var t = profile.typography || {};
  var sp = profile.spacing || {};
  var r = sp.radius || {};

  var note = document.createElement('p');
  note.className = 'style-controls-note';
  note.textContent = 'Preview overrides apply to prototypes that use Factory CSS variables.';
  container.appendChild(note);

  // Colors
  var colorKeys = ['primary', 'accent', 'background', 'foreground', 'muted', 'secondary', 'destructive'];
  colorKeys.forEach(function(key) {
    if (c[key]) {
      container.appendChild(makeColorControl(key.charAt(0).toUpperCase() + key.slice(1), key, c[key]));
      styleOverrides[key] = c[key];
    }
  });

  // Divider
  var div1 = document.createElement('div');
  div1.className = 'controls-divider';
  container.appendChild(div1);

  // Typography — show all font entries from profile
  var fontKeys = Object.keys(t);
  fontKeys.forEach(function(key) {
    var cpKey = 'font-' + key;
    container.appendChild(makeFontControl('Font (' + key + ')', cpKey, t[key]));
    styleOverrides[cpKey] = t[key];
  });

  // Divider
  var div2 = document.createElement('div');
  div2.className = 'controls-divider';
  container.appendChild(div2);

  // Radius
  if (r.md) {
    container.appendChild(makeRadiusControl('Border Radius', 'radius-md', r.md));
    styleOverrides['radius-md'] = r.md;
  }

  // Buttons row
  var div3 = document.createElement('div');
  div3.className = 'controls-divider';
  container.appendChild(div3);

  var resetBtn = document.createElement('button');
  resetBtn.className = 'btn-reset';
  resetBtn.textContent = 'Reset preview overrides';
  resetBtn.onclick = function() {
    styleOverrides = {};
    buildStyleControls(styleProfile);
    // Reload iframe to reset injected vars
    var iframe = document.querySelector('.preview-iframe');
    if (iframe) iframe.src = iframe.src;
  };
  container.appendChild(resetBtn);
}

function loadStyleProfile() {
  fetch('/api/style-profile')
    .then(function(r) {
      if (r.status === 404) return null;
      return r.json();
    })
    .then(function(profile) { buildStyleControls(profile); })
    .catch(function() { buildStyleControls(null); });
}

function triggerRescan() {
  var btns = document.querySelectorAll('.btn-rescan');
  btns.forEach(function(b) { b.disabled = true; b.textContent = 'Scanning...'; });

  fetch('/api/scan', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(profile) {
      styleOverrides = {};
      buildStyleControls(profile && !profile.error ? profile : null);
      // Reload iframe to get fresh server-injected vars
      var iframe = document.querySelector('.preview-iframe');
      if (iframe) iframe.src = iframe.src;
    })
    .catch(function() {
      btns.forEach(function(b) {
        b.disabled = false;
        b.textContent = 'Re-scan (failed)';
        setTimeout(function() { b.textContent = 'Re-scan project'; }, 2000);
      });
    });
}

loadStyleProfile();

// --- WebSocket ---
var ws = null;
var eventQueue = [];

function wsConnect() {
  ws = new WebSocket('ws://' + window.location.host);
  ws.onopen = function() {
    eventQueue.forEach(function(e) { ws.send(JSON.stringify(e)); });
    eventQueue = [];
    var dot = document.getElementById('status-dot');
    dot.className = 'status-dot connected';
    dot.querySelector('.status-dot-label').textContent = 'connected';
    setTimeout(function() {
      dot.querySelector('.status-dot-label').textContent = '';
    }, 2000);
  };
  ws.onmessage = function(msg) {
    var data = JSON.parse(msg.data);
    if (data.type === 'reload') {
      var iframe = document.querySelector('.preview-iframe');
      if (iframe) iframe.src = iframe.src;
    } else if (data.type === 'compare') {
      enterCompareMode(data.items);
    }
  };
  ws.onclose = function() {
    var dot = document.getElementById('status-dot');
    dot.className = 'status-dot';
    dot.querySelector('.status-dot-label').textContent = 'Reconnecting...';
    setTimeout(wsConnect, 1000);
  };
}

function sendEvent(event) {
  event.timestamp = Date.now();
  if (activePage) event.page = activePage;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(event));
  } else {
    eventQueue.push(event);
  }
}

// --- Compare mode ---
var savedChildren = null;

function enterCompareMode(items) {
  compareMode = true;
  compareItems = items;

  var previewArea = document.querySelector('.preview-area');
  if (!savedChildren) {
    savedChildren = [];
    while (previewArea.firstChild) {
      savedChildren.push(previewArea.removeChild(previewArea.firstChild));
    }
  } else {
    clearChildren(previewArea);
  }

  var header = document.createElement('div');
  header.className = 'compare-header';

  var title = document.createElement('span');
  title.textContent = 'Compare: ' + items.map(function(i) { return i.label || i.slug; }).join(' vs ');
  header.appendChild(title);

  var backBtn = document.createElement('button');
  backBtn.className = 'compare-back-btn';
  backBtn.textContent = '\u2190 Back';
  backBtn.onclick = exitCompareMode;
  header.appendChild(backBtn);

  previewArea.appendChild(header);

  var container = document.createElement('div');
  container.className = 'compare-container';
  container.style.gridTemplateColumns = 'repeat(' + items.length + ', 1fr)';

  items.forEach(function(item) {
    var col = document.createElement('div');
    col.className = 'compare-col';

    var label = document.createElement('div');
    label.className = 'compare-label';
    label.textContent = item.label || item.slug;
    col.appendChild(label);

    if (item.file) {
      var iframe = document.createElement('iframe');
      iframe.className = 'compare-iframe';
      iframe.src = buildPreviewUrl(item.file);
      col.appendChild(iframe);
    } else {
      var notFound = document.createElement('div');
      notFound.className = 'compare-not-found';
      notFound.textContent = 'Not found: ' + item.slug;
      col.appendChild(notFound);
    }

    container.appendChild(col);
  });

  previewArea.appendChild(container);

  var footer = document.createElement('div');
  footer.className = 'compare-footer';
  footer.textContent = 'Pick in terminal: triage <slug> done';
  previewArea.appendChild(footer);
}

function exitCompareMode() {
  compareMode = false;
  compareItems = [];
  var previewArea = document.querySelector('.preview-area');
  clearChildren(previewArea);
  if (savedChildren) {
    savedChildren.forEach(function(node) { previewArea.appendChild(node); });
    savedChildren = null;
    var iframe = document.querySelector('.preview-iframe');
    if (iframe && activeFile) {
      iframe.src = buildPreviewUrl(activeFile);
    }
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && compareMode) {
    exitCompareMode();
  }
});

wsConnect();

// --- Listen for option-select from prototype iframe ---
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'option-select') return;
  selectedOption = e.data.label || e.data.value;
  updateStylePrompt();
  sendEvent({ type: 'option-select', value: e.data.value, label: e.data.label });
});
</script>
