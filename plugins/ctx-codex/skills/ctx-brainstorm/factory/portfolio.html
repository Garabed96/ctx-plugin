<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Portfolio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0e17;
    color: #e2e8f0;
    min-height: 100vh;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.25rem;
    background: #1e293b;
    border-bottom: 1px solid #334155;
  }
  .top-bar-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #e2e8f0;
  }
  .top-bar-subtitle {
    font-size: 0.72rem;
    color: #64748b;
    margin-left: 0.5rem;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 180px 160px;
    gap: 0.6rem;
    padding: 1rem 1.25rem 0;
  }
  .toolbar input,
  .toolbar select {
    width: 100%;
    background: #0f172a;
    color: #cbd5e1;
    border: 1px solid #334155;
    border-radius: 7px;
    padding: 0.55rem 0.65rem;
    font-size: 0.78rem;
    font-family: inherit;
  }
  .toolbar input:focus,
  .toolbar select:focus {
    outline: none;
    border-color: #818cf8;
    box-shadow: 0 0 0 1px #818cf8;
  }
  @media (max-width: 760px) {
    .toolbar {
      grid-template-columns: 1fr;
    }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
    padding: 1.25rem;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    border-color: #818cf8;
    box-shadow: 0 0 0 1px #818cf8;
  }

  .card-thumb {
    position: relative;
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: #fff;
  }
  .card-thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    transform: scale(0.234375);
    transform-origin: top left;
    border: none;
    pointer-events: none;
  }

  .card-body {
    padding: 0.75rem 0.85rem;
  }
  .card-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: #e2e8f0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    margin-bottom: 0.4rem;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.62rem;
    padding: 0.15rem 0.45rem;
    border-radius: 9999px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-versions {
    background: #1e1b4b;
    color: #a5b4fc;
    border: 1px solid #312e81;
  }
  .badge-group {
    background: #172554;
    color: #93c5fd;
    border: 1px solid #1d4ed8;
  }
  .badge-selected {
    background: #042f2e;
    color: #5eead4;
    border: 1px solid #115e59;
  }
  .badge-time {
    color: #475569;
    font-size: 0.62rem;
    margin-left: auto;
  }

  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    color: #475569;
    font-size: 0.9rem;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:baseline;">
    <span class="top-bar-title">Factory Portfolio</span>
    <span class="top-bar-subtitle" id="page-count"></span>
  </div>
</div>

<div class="toolbar">
  <input id="page-search" type="search" placeholder="Search pages, groups, selected options..." oninput="updateFilters()" />
  <select id="category-filter" onchange="updateFilters()">
    <option value="">All categories</option>
  </select>
  <select id="sort-select" onchange="updateFilters()">
    <option value="updated-desc">Newest</option>
    <option value="updated-asc">Oldest</option>
    <option value="name-asc">Name A-Z</option>
    <option value="name-desc">Name Z-A</option>
    <option value="category-asc">Category A-Z</option>
  </select>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">
  <p>No pages yet.<br>Use the factory to brainstorm your first page.</p>
</div>

<script>
var allPages = [];
var filters = { query: '', category: '', sort: 'updated-desc' };

function buildFactoryHref(page) {
  return '/factory/' + page.split('/').map(function(part) {
    return encodeURIComponent(part);
  }).join('/');
}

function relativeTime(iso) {
  if (!iso) return '';
  var diff = Date.now() - new Date(iso).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  var days = Math.floor(hours / 24);
  return days + 'd ago';
}

function compareText(a, b) {
  return String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
}

function getPageTime(page) {
  return page && page.lastModified ? new Date(page.lastModified).getTime() : 0;
}

function updateCategoryOptions(pages) {
  var select = document.getElementById('category-filter');
  var current = select.value;
  var groups = [];
  var seen = {};
  pages.forEach(function(page) {
    var group = page.group || 'Ungrouped';
    if (!seen[group]) {
      seen[group] = true;
      groups.push(group);
    }
  });
  groups.sort(compareText);
  select.innerHTML = '';
  var all = document.createElement('option');
  all.value = '';
  all.textContent = 'All categories';
  select.appendChild(all);
  groups.forEach(function(group) {
    var opt = document.createElement('option');
    opt.value = group;
    opt.textContent = group;
    select.appendChild(opt);
  });
  select.value = seen[current] ? current : '';
  filters.category = select.value;
}

function getFilteredPages() {
  var query = (filters.query || '').trim().toLowerCase();
  var category = filters.category || '';
  var pages = allPages.filter(function(page) {
    var group = page.group || 'Ungrouped';
    var matchesCategory = !category || group === category;
    var haystack = [
      group,
      page.page,
      page.name,
      page.selectedOption,
      page.latestFile
    ].join(' ').toLowerCase();
    return matchesCategory && (!query || haystack.indexOf(query) !== -1);
  });

  pages.sort(function(a, b) {
    if (filters.sort === 'updated-asc') return getPageTime(a) - getPageTime(b);
    if (filters.sort === 'name-asc') return compareText(a.name || a.page, b.name || b.page);
    if (filters.sort === 'name-desc') return compareText(b.name || b.page, a.name || a.page);
    if (filters.sort === 'category-asc') {
      var groupCompare = compareText(a.group || 'Ungrouped', b.group || 'Ungrouped');
      return groupCompare || compareText(a.name || a.page, b.name || b.page);
    }
    return getPageTime(b) - getPageTime(a);
  });

  return pages;
}

function updateFilters() {
  filters.query = document.getElementById('page-search').value;
  filters.category = document.getElementById('category-filter').value;
  filters.sort = document.getElementById('sort-select').value;
  renderCards(getFilteredPages());
}

function renderCards(pages) {
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var count = document.getElementById('page-count');
  grid.innerHTML = '';

  if (!pages || pages.length === 0) {
    grid.style.display = 'none';
    empty.style.display = '';
    count.textContent = allPages.length ? '0 of ' + allPages.length + ' pages' : '';
    empty.querySelector('p').innerHTML = allPages.length
      ? 'No pages match the current filters.'
      : 'No pages yet.<br>Use the factory to brainstorm your first page.';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';
  count.textContent = pages.length + ' of ' + allPages.length + (allPages.length === 1 ? ' page' : ' pages');

  pages.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'card';
    card.onclick = function() { window.location.href = buildFactoryHref(p.page); };

    // Thumbnail
    var thumb = document.createElement('div');
    thumb.className = 'card-thumb';
    if (p.latestFile) {
      var iframe = document.createElement('iframe');
      iframe.src = '/prototype?file=' + encodeURIComponent(p.latestFile);
      iframe.setAttribute('loading', 'lazy');
      iframe.setAttribute('tabindex', '-1');
      thumb.appendChild(iframe);
    }
    card.appendChild(thumb);

    // Body
    var body = document.createElement('div');
    body.className = 'card-body';

    var name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = p.name || p.page;
    body.appendChild(name);

    var meta = document.createElement('div');
    meta.className = 'card-meta';

    var vBadge = document.createElement('span');
    vBadge.className = 'badge badge-versions';
    vBadge.textContent = p.versions + (p.versions === 1 ? ' version' : ' versions');
    meta.appendChild(vBadge);

    if (p.group && p.group !== 'Ungrouped') {
      var gBadge = document.createElement('span');
      gBadge.className = 'badge badge-group';
      gBadge.textContent = p.group;
      meta.appendChild(gBadge);
    }

    if (p.selectedOption) {
      var sBadge = document.createElement('span');
      sBadge.className = 'badge badge-selected';
      sBadge.textContent = p.selectedOption;
      meta.appendChild(sBadge);
    }

    if (p.lastModified) {
      var time = document.createElement('span');
      time.className = 'badge-time';
      time.textContent = relativeTime(p.lastModified);
      meta.appendChild(time);
    }

    body.appendChild(meta);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

fetch('/api/page-status')
  .then(function(r) { return r.json(); })
  .then(function(pages) {
    allPages = pages || [];
    updateCategoryOptions(allPages);
    renderCards(getFilteredPages());
  })
  .catch(function(err) {
    document.getElementById('empty').style.display = '';
    document.getElementById('empty').querySelector('p').textContent = 'Failed to load: ' + err.message;
  });
</script>
</body>
</html>
